<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="auto">
  <defs>
    <style>
      .brand-cafe-text {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 700;
        font-size: 56px;
        fill: #075734;
      }
      .brand-yashoda-text {
        font-family: 'League Spartan', 'Bebas Neue', 'Oswald', 'Arial Black', Impact, sans-serif;
        font-weight: 900;
        font-size: 110px;
        letter-spacing: 6px;
        fill: #075734;
      }
    </style>
  </defs>

  <!-- "Cafe" with gold curved underline -->
  <g transform="translate(40, 0)">
    <text x="80" y="65" class="brand-cafe-text">Cafe</text>
    <path d="M76 80 Q120 70 170 78" stroke="#D2A51A" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Botanical leaf on top right above the last 'A' -->
  <g transform="translate(470, 42) rotate(-10)">
    <path d="M0 26 C-6 16 2 4 15 0 C17 12 11 23 0 26 Z" fill="#075734"/>
    <path d="M13 22 C9 14 15 4 25 2 C26 11 21 20 13 22 Z" fill="#075734"/>
    <path d="M-2 29 Q8 18 17 2" stroke="#D2A51A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- "YASHODA" in massive bold condensed display centered in 600px width -->
  <text x="300" y="165" class="brand-yashoda-text" text-anchor="middle">YASHODA</text>

  <!-- Gold Smile / Swoosh curve with right arrow -->
  <path d="M255 192 Q300 216 350 194" stroke="#D2A51A" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  <path d="M344 188 L358 192 L350 206" stroke="#D2A51A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
