<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cardMocktail" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00663B" />
      <stop offset="100%" stop-color="#00351E" />
    </radialGradient>
    <linearGradient id="blueLagoon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#0091EA" />
      <stop offset="100%" stop-color="#01579B" />
    </linearGradient>
    <filter id="fShadow6">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00180D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#cardMocktail)"/>
  <rect x="10" y="10" width="580" height="430" rx="12" fill="none" stroke="#D5A817" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.6"/>

  <g transform="translate(190, 40)" filter="url(#fShadow6)">
    <!-- Hurricane / Mocktail Glass -->
    <path d="M60 50 Q80 160 55 240 L55 270 L165 270 L165 240 Q140 160 160 50 Z" fill="url(#blueLagoon)" opacity="0.95"/>
    <path d="M60 50 Q80 160 55 240 L55 270 L165 270 L165 240 Q140 160 160 50 Z" fill="#FFF" fill-opacity="0.15" stroke="#FFF" stroke-width="2"/>
    <ellipse cx="110" cy="50" rx="50" ry="12" fill="#E0F7FA"/>
    <ellipse cx="110" cy="270" rx="45" ry="10" fill="#D5A817"/>

    <!-- Lemon Wedge & Mint -->
    <path d="M40 45 A 30 30 0 0 1 80 15 L60 55 Z" fill="#FFEB3B" stroke="#FFF" stroke-width="2"/>
    <path d="M140 30 C160 10 175 25 155 45 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5"/>

    <!-- Straw & umbrella -->
    <line x1="110" y1="50" x2="70" y2="-25" stroke="#D5A817" stroke-width="7" stroke-linecap="round"/>
    <path d="M125 30 L165 -15 L180 5 Z" fill="#FF4081" stroke="#C2185B" stroke-width="1"/>
  </g>

  <!-- Editorial Badge -->
  <g transform="translate(300, 395)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#00351E" stroke="#D5A817" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'League Spartan', 'Arial Black', sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#FFF9ED" text-anchor="middle">REFRESHING MOCKTAILS</text>
  </g>
</svg>
