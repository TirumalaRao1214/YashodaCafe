<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="100%" height="100%">
  <defs>
    <radialGradient id="aboutBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00663B" />
      <stop offset="70%" stop-color="#004324" />
      <stop offset="100%" stop-color="#002915" />
    </radialGradient>
    <filter id="abShadow">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#00180D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="700" height="600" rx="20" fill="url(#aboutBg)"/>
  <rect x="14" y="14" width="672" height="572" rx="16" fill="none" stroke="#D5A817" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.6"/>

  <!-- Botanical Flankers -->
  <g stroke="#D5A817" stroke-width="1.4" fill="none" opacity="0.6">
    <path d="M60 120 Q120 70 200 100"/>
    <path d="M100 95 C95 70 120 60 130 80 Z" fill="#D5A817" fill-opacity="0.2"/>
    <path d="M640 480 Q580 530 500 500"/>
    <path d="M600 505 C605 530 580 540 570 520 Z" fill="#D5A817" fill-opacity="0.2"/>
  </g>

  <!-- Big Illustrated Warm Kettle & Traditional Cups -->
  <g transform="translate(230, 90)" filter="url(#abShadow)">
    <!-- Traditional Brass Tea Kettle -->
    <path d="M60 190 Q50 330 140 330 Q230 330 220 190 Z" fill="#FFFDF8" stroke="#D5A817" stroke-width="3"/>
    <ellipse cx="140" cy="190" rx="80" ry="24" fill="#E8DEC9" stroke="#D5A817" stroke-width="2"/>
    <ellipse cx="140" cy="170" rx="55" ry="16" fill="#005A32" stroke="#D5A817" stroke-width="2"/>
    <!-- Lid Knob -->
    <circle cx="140" cy="145" r="10" fill="#D5A817"/>

    <!-- Kettle Spout -->
    <path d="M65 240 Q10 200 20 140 Q40 140 40 155 Q30 210 75 220 Z" fill="#FFFDF8" stroke="#D5A817" stroke-width="2.5"/>

    <!-- Kettle Handle -->
    <path d="M40 180 Q30 60 140 60 Q250 60 240 180" fill="none" stroke="#422209" stroke-width="18" stroke-linecap="round"/>
    <path d="M40 180 Q30 60 140 60 Q250 60 240 180" fill="none" stroke="#D5A817" stroke-width="3" stroke-linecap="round"/>

    <!-- Yashoda Botanical Crest on Kettle -->
    <g transform="translate(140, 260) scale(0.9)">
      <circle cx="0" cy="0" r="28" fill="#005A32" stroke="#D5A817" stroke-width="1.5"/>
      <path d="M-8 6 C-12 -2 -4 -12 6 -14 C8 -4 2 6 -8 6 Z" fill="#D5A817"/>
      <path d="M4 4 C0 -2 6 -8 14 -6 C14 2 8 6 4 4 Z" fill="#FFFDF8"/>
    </g>

    <!-- Hot Chai stream pouring -->
    <path d="M22 142 Q-30 220 -20 320" stroke="#E2A648" stroke-width="5" fill="none" opacity="0.9" stroke-linecap="round"/>

    <!-- Glass catching the tea -->
    <g transform="translate(-50, 250)">
      <polygon points="10,40 16,110 44,110 50,40" fill="#FFFDF8" fill-opacity="0.2" stroke="#D5A817" stroke-width="1.5"/>
      <polygon points="12,50 17,108 43,108 48,50" fill="#D49A3D"/>
    </g>
  </g>

  <!-- Editorial Ribbon / Motto -->
  <g transform="translate(350, 520)">
    <rect x="-190" y="-22" width="380" height="44" rx="22" fill="#00351E" stroke="#D5A817" stroke-width="2"/>
    <text x="0" y="5" font-family="'League Spartan', 'Arial Black', sans-serif" font-size="14" font-weight="900" letter-spacing="3" fill="#FFF9ED" text-anchor="middle">GOOD FOOD • BRIGHTER DAYS</text>
  </g>
</svg>
