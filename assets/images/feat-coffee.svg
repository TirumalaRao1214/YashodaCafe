<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cardCoffee" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00663B" />
      <stop offset="100%" stop-color="#00351E" />
    </radialGradient>
    <linearGradient id="coffeeL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFE0D3" />
      <stop offset="30%" stop-color="#795548" />
      <stop offset="100%" stop-color="#3E2723" />
    </linearGradient>
    <filter id="fShadow7">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00180D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#cardCoffee)"/>
  <rect x="10" y="10" width="580" height="430" rx="12" fill="none" stroke="#D5A817" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.6"/>

  <g transform="translate(170, 70)" filter="url(#fShadow7)">
    <!-- Saucer -->
    <ellipse cx="130" cy="240" rx="140" ry="24" fill="#FFFDF8" stroke="#D5A817" stroke-width="2"/>
    <ellipse cx="130" cy="238" rx="100" ry="15" fill="#E8DEC9"/>

    <!-- Handle -->
    <path d="M190 110 C245 110 245 190 190 190" fill="none" stroke="#FFFDF8" stroke-width="16" stroke-linecap="round"/>
    <path d="M190 110 C245 110 245 190 190 190" fill="none" stroke="#D5A817" stroke-width="2" stroke-linecap="round"/>

    <!-- Cup Body -->
    <path d="M50 80 L65 210 Q70 235 130 235 Q190 235 195 210 L210 80 Z" fill="#FFFDF8" stroke="#D5A817" stroke-width="2"/>
    <ellipse cx="130" cy="80" rx="80" ry="22" fill="#D5A817"/>
    <ellipse cx="130" cy="80" rx="76" ry="18" fill="url(#coffeeL)"/>

    <!-- Latte Art Rosette -->
    <path d="M130 90 C115 72 95 75 105 64 C115 54 130 68 130 72 C130 68 145 54 155 64 C165 75 145 72 130 90 Z" fill="#FFFDF8"/>
    <line x1="130" y1="58" x2="130" y2="94" stroke="#FFFDF8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Steam -->
    <path d="M110 50 Q100 20 115 -10" stroke="#FFFDF8" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M145 52 Q160 22 145 -15" stroke="#D5A817" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- Editorial Badge -->
  <g transform="translate(300, 395)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#00351E" stroke="#D5A817" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'League Spartan', 'Arial Black', sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#FFF9ED" text-anchor="middle">FRESH BREWED COFFEE</text>
  </g>
</svg>
