<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cardShake" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00663B" />
      <stop offset="100%" stop-color="#00351E" />
    </radialGradient>
    <linearGradient id="shakeGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E0" />
      <stop offset="50%" stop-color="#FF4081" />
      <stop offset="100%" stop-color="#AD1457" />
    </linearGradient>
    <filter id="fShadow3">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00180D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#cardShake)"/>
  <rect x="10" y="10" width="580" height="430" rx="12" fill="none" stroke="#D5A817" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.6"/>

  <g transform="translate(200, 30)" filter="url(#fShadow3)">
    <!-- Tall Shake Glass -->
    <path d="M55 70 Q60 170 50 250 L50 280 L150 280 L150 250 Q140 170 145 70 Z" fill="url(#shakeGrad2)"/>
    <path d="M55 70 Q60 170 50 250 L50 280 L150 280 L150 250 Q140 170 145 70 Z" fill="#FFF" fill-opacity="0.1" stroke="#FFF" stroke-width="2"/>
    <ellipse cx="100" cy="280" rx="40" ry="10" fill="#D5A817"/>
    
    <!-- Whipped Cream & Drizzle -->
    <path d="M55 70 Q100 10 145 70 Q150 30 110 5 Q90 0 100 -15 Q70 20 55 70 Z" fill="#FFFDF8"/>
    <path d="M80 30 Q90 60 85 110 Q92 160 86 210" stroke="#880E4F" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    
    <!-- Cherry & Wafer -->
    <circle cx="100" cy="-16" r="14" fill="#C2185B" stroke="#880E4F" stroke-width="1.5"/>
    <line x1="130" y1="30" x2="170" y2="-40" stroke="#D7CCC8" stroke-width="8" stroke-linecap="round"/>
    <line x1="130" y1="30" x2="170" y2="-40" stroke="#795548" stroke-width="2" stroke-dasharray="4,6"/>
  </g>

  <!-- Editorial Badge -->
  <g transform="translate(300, 395)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#00351E" stroke="#D5A817" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'League Spartan', 'Arial Black', sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#FFF9ED" text-anchor="middle">SIGNATURE MILKSHAKES</text>
  </g>
</svg>
