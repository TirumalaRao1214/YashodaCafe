<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="cardSundae" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00663B" />
      <stop offset="100%" stop-color="#00351E" />
    </radialGradient>
    <filter id="fShadow4">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00180D" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#cardSundae)"/>
  <rect x="10" y="10" width="580" height="430" rx="12" fill="none" stroke="#D5A817" stroke-width="1.2" stroke-dasharray="4,6" opacity="0.6"/>

  <g transform="translate(170, 70)" filter="url(#fShadow4)">
    <!-- Glass Footed Coupe -->
    <ellipse cx="130" cy="230" rx="60" ry="12" fill="#002E19" opacity="0.6"/>
    <path d="M100 200 L100 228 L160 228 L160 200 Z" fill="#FFF" fill-opacity="0.3" stroke="#D5A817" stroke-width="1.5"/>
    <path d="M40 90 Q40 200 130 200 Q220 200 220 90 Z" fill="#FFF" fill-opacity="0.2" stroke="#D5A817" stroke-width="2"/>

    <!-- Ice Cream Triple Scoops -->
    <circle cx="90" cy="80" r="45" fill="#4E342E" stroke="#3E2723" stroke-width="1.5"/>
    <circle cx="130" cy="55" r="48" fill="#FFFDF8" stroke="#E0E0E0" stroke-width="1.5"/>
    <circle cx="170" cy="80" r="45" fill="#E91E63" stroke="#C2185B" stroke-width="1.5"/>

    <!-- Chocolate Sauce & Caramel Swirls -->
    <path d="M60 70 Q100 120 130 65 Q160 115 200 80" stroke="#3E2723" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M80 60 Q120 100 150 55" stroke="#FFA000" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Golden Almonds & Cashews -->
    <circle cx="110" cy="45" r="3" fill="#D5A817"/>
    <circle cx="135" cy="40" r="3.5" fill="#D5A817"/>
    <circle cx="155" cy="55" r="3" fill="#D5A817"/>
    <circle cx="85" cy="65" r="3" fill="#D5A817"/>
  </g>

  <!-- Editorial Badge -->
  <g transform="translate(300, 395)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#00351E" stroke="#D5A817" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'League Spartan', 'Arial Black', sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#FFF9ED" text-anchor="middle">ICE CREAM DELIGHTS</text>
  </g>
</svg>
